<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL Ghost Hunter — Interactive Academic Guide, Viva Prep & Evaluation Suite</title>
  <meta name="description" content="Complete interactive project explainer, 12-section viva voce guide, architecture explainer, and faculty feedback suite for SQL Ghost Hunter.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/help-glass.css">
  <style>
    /* Standalone Page Enhancements */
    body {
      background: #f8fafc radial-gradient(at 0% 0%, rgba(224, 231, 255, 0.6) 0px, transparent 50%),
                  radial-gradient(at 100% 100%, rgba(224, 242, 254, 0.6) 0px, transparent 50%);
      min-height: 100vh;
      color: #0f172a;
      font-family: var(--font, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      margin: 0;
      padding: 0;
    }

    .standalone-header {
      position: sticky;
      top: 0;
      z-index: 999;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.85);
      box-shadow: 0 4px 20px -5px rgba(15, 23, 42, 0.05);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .standalone-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .standalone-brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .standalone-brand-name {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .standalone-brand-tag {
      font-size: 11.5px;
      color: #64748b;
      font-weight: 500;
    }

    .standalone-nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .standalone-main-content {
      max-width: 1440px;
      margin: 24px auto;
      padding: 0 20px 60px;
    }

    @media print {
      .standalone-header, .glass-tabs-bar, .quick-mode-btn, button, .glass-search-box {
        display: none !important;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .glass-card, .glass-hero {
        box-shadow: none !important;
        border: 1px solid #ccc !important;
        background: #fff !important;
      }
    }
  </style>
</head>
<body>

  <!-- Top Sticky Header -->
  <header class="standalone-header">
    <a href="/" class="standalone-brand" title="SQL Ghost Hunter Home">
      <div class="standalone-brand-logo">GH</div>
      <div>
        <div class="standalone-brand-name">SQL Ghost Hunter</div>
        <div class="standalone-brand-tag">Interactive Academic Explainer &amp; Feedback Suite</div>
      </div>
    </a>

    <div class="standalone-nav-actions">
      <span class="glass-pill success">
        <span class="help-pulse"></span> MySQL 8.0 &bull; 3NF Relational Integrity &bull; Offline Capable
      </span>
      <a href="/" class="btn-glass-help" title="Return to Live Application Dashboard">
        <span>&larr; Live Dashboard</span>
      </a>
      <a href="#feedback" class="btn-glass-help" style="background:#eff6ff;border-color:#93c5fd;color:#1e40af;" onclick="location.hash='#feedback'; location.reload();" title="Jump to Examiner Evaluation & Review Suite">
        <span>⭐ Evaluator Feedback</span>
      </a>
      <button type="button" class="btn-glass-help" onclick="window.print()" title="Print or save this guide as PDF">
        <span>🖨️ Print / Save PDF</span>
      </button>
    </div>
  </header>

  <!-- Mount Container -->
  <main class="standalone-main-content">
    <div id="help-standalone-root">
      <div style="text-align:center;padding:80px 20px;color:#64748b;">
        <div style="font-size:24px;font-weight:700;color:#0f172a;margin-bottom:8px;">Loading Interactive Learning Suite...</div>
        <div>Initializing 12 master modules, viva questions, and relational explainer data.</div>
      </div>
    </div>
  </main>

  <!-- Libraries -->
  <script src="assets/vendor/marked.umd.js" defer></script>
  <script src="assets/vendor/purify.min.js" defer></script>

  <!-- Standalone Module Bootstrapper -->
  <script type="module">
    import { initStandaloneHelp } from './js/help-standalone.js';
    const root = document.getElementById('help-standalone-root');
    initStandaloneHelp(root);
  </script>
</body>
</html>
