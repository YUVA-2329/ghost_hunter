name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Test Suite & Health Probes
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Admin@Ghost2026
          MYSQL_DATABASE: ghost_hunter_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure test environment
        run: |
          cp .env.example .env
          sed -i 's/DB_ADMIN_PASSWORD=.*/DB_ADMIN_PASSWORD=Admin@Ghost2026/' .env
          sed -i 's/DB_NAME=.*/DB_NAME=ghost_hunter_test/' .env
          sed -i 's/DB_APP_PASSWORD=.*/DB_APP_PASSWORD=GhostApp@Test2026/' .env

      - name: Run Pytest automated test suite
        run: |
          python -m pytest tests -v
